server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Forward browser headers transparently; never manufacture an admin token.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    # Agent may make sequential model calls. This does not change model timeouts.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Only the Agent SSE endpoint disables proxy buffering. Keep the rest of
    # the API on its existing proxy behavior.
    location = /api/agent/chat/stream {
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        proxy_pass http://api:8000;
        add_header X-Accel-Buffering no always;
    }
    location /api/ {
        proxy_pass http://api:8000;
    }
    location /internal/ {
        proxy_pass http://api:8000;
    }
    location = /health {
        proxy_pass http://api:8000;
    }
    location = /ready {
        proxy_pass http://api:8000;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
